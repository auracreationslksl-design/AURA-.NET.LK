    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #030712;
            --bg-card: rgba(17, 24, 39, 0.85);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --accent: #6366f1;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --border: rgba(56, 189, 248, 0.2);
            --badge-bg: rgba(56, 189, 248, 0.1);
            --input-bg: rgba(255, 255, 255, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.85)), url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .maintenance-card {
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 24px;
            padding: 45px 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 50px var(--primary-glow);
            backdrop-filter: blur(16px);
            position: relative;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .update-icon {
            width: 80px; height: 80px;
            background: var(--badge-bg);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: var(--primary);
            margin: 0 auto 25px;
            box-shadow: 0 0 20px var(--primary-glow);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px var(--primary-glow); }
            100% { box-shadow: 0 0 30px var(--primary); }
        }

        .tag {
            background: var(--badge-bg);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        h1 span {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
            transition: 0.3s;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.7);
        }

        .bypass-toggle {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-sub);
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .bypass-toggle:hover {
            color: var(--primary);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body id="bodyTag">

    <footer>

            document.getElementById('maintenanceBox').style.display = 'none';

        function enableMaintenance() {
            document.getElementById('maintenanceBox').style.display = 'block';
