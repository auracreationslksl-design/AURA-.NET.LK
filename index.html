<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA NET.LK | Premier Tech & Digital Solutions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #070a13;
            --bg-card: rgba(15, 23, 42, 0.75);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --accent: #818cf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(7, 10, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .logo span { color: var(--primary); }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        /* Hero Section */
        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at center, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            animation: fadeInDown 1s ease-out;
        }

        .hero h1 span { color: var(--primary); }

        .hero p {
            color: var(--text-sub);
            max-width: 650px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease-out 0.4s backwards;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }

        .btn-whatsapp {
            background: #22c55e;
            color: #fff;
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            background: #16a34a;
        }

        /* Sections */
        section { padding: 80px 8%; }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-header h2 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .section-header p { color: var(--text-sub); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        /* Cards & Hover Animations */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 32px 25px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .card-icon {
            font-size: 30px;
            color: var(--primary);
            margin-bottom: 18px;
            transition: transform 0.3s ease;
        }

        .card:hover .card-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .click-hint {
            display: inline-block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            transition: transform 0.3s ease;
        }

        .card:hover .click-hint {
            transform: translateX(6px);
        }

        /* Contact Section */
        .contact-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.05rem;
            transition: 0.3s;
        }

        .info-item i {
            font-size: 22px;
            color: var(--primary);
            width: 30px;
        }

        .info-item:hover { color: var(--primary); }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Modal Overlay & Animations */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--primary);
            border-radius: 16px;
            max-width: 650px;
            width: 100%;
            padding: 35px;
            position: relative;
            box-shadow: 0 0 40px var(--primary-glow);
